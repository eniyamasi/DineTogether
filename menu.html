<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canteen Menu with Shared Cart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }

    .navbar-brand {
      font-size: 24px;
      font-weight: bold;
    }

    .card img {
      height: 200px;
      object-fit: cover;
    }

    .card-title {
      font-size: 18px;
      font-weight: bold;
    }

    #cart-button {
      font-size: 18px;
    }

    .list-group-item-action {
      cursor: pointer;
    }

    .shared-cart-info {
      background-color: #e3f2fd;
      border: 2px solid #2196f3;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .cart-owner-badge {
      background-color: #4caf50;
      color: white;
      padding: 5px 10px;
      border-radius: 15px;
      font-size: 12px;
    }

    .added-by-tag {
      font-size: 11px;
      color: #666;
      font-style: italic;
    }

    .checkout-disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .real-time-update {
      position: fixed;
      top: 80px;
      right: 20px;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-light bg-light">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">FoodChow</a>
      <div>
        <button class="btn btn-outline-success" id="cart-button" data-bs-toggle="modal" data-bs-target="#cartModal">
          Cart <span class="badge bg-secondary" id="cart-count">0</span> ₹<span id="cart-total">0</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Real-time update notifications -->
  <div id="notification-area" class="real-time-update"></div>

  <!-- Shared Cart Info Banner -->
  <div id="shared-cart-banner" class="container-fluid" style="display: none;">
    <div class="shared-cart-info">
      <div class="row align-items-center">
        <div class="col-md-8">
          <h5 class="mb-1">
            <i class="bi bi-share"></i> Shared Cart
            <span class="cart-owner-badge" id="cart-owner-badge"></span>
          </h5>
          <p class="mb-1" id="shared-cart-message"></p>
          <small class="text-muted" id="cart-created-info"></small>
        </div>
        <div class="col-md-4 text-end">
          <button class="btn btn-sm btn-outline-primary" id="copy-link-btn" style="display: none;">
            Copy Link Again
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="container-fluid">
    <div class="row mt-4">
      <div class="col-md-3">
        <div class="list-group">
          <input type="text" class="form-control mb-2" placeholder="Search items..." id="search-bar">
          <a href="#" class="list-group-item list-group-item-action" data-category="all">All Items</a>
          <a href="#" class="list-group-item list-group-item-action" data-category="burgers">Burgers</a>
          <a href="#" class="list-group-item list-group-item-action" data-category="pizzas">Pizzas</a>
          <a href="#" class="list-group-item list-group-item-action" data-category="fries">Fries</a>
          <a href="#" class="list-group-item list-group-item-action" data-category="drinks">Drinks</a>
        </div>
      </div>

      <div class="col-md-9">
        <div class="row" id="menu-grid">
          <div class="col-md-4">
            <div class="card mb-4" data-category="burgers">
              <img src="https://via.placeholder.com/150" class="card-img-top" alt="Burger">
              <div class="card-body">
                <h5 class="card-title">Burger</h5>
                <p class="card-text">₹100</p>
                <button class="btn btn-primary add-to-cart" data-name="Burger" data-price="100">Add to Cart</button>
              </div>
            </div>
          </div>

          <div class="col-md-4">
            <div class="card mb-4" data-category="pizzas">
              <img src="https://via.placeholder.com/150" class="card-img-top" alt="Pizza">
              <div class="card-body">
                <h5 class="card-title">Pizza</h5>
                <p class="card-text">₹150</p>
                <button class="btn btn-primary add-to-cart" data-name="Pizza" data-price="150">Add to Cart</button>
              </div>
            </div>
          </div>

          <div class="col-md-4">
            <div class="card mb-4" data-category="fries">
              <img src="https://via.placeholder.com/150" class="card-img-top" alt="Fries">
              <div class="card-body">
                <h5 class="card-title">Fries</h5>
                <p class="card-text">₹50</p>
                <button class="btn btn-primary add-to-cart" data-name="Fries" data-price="50">Add to Cart</button>
              </div>
            </div>
          </div>

          <div class="col-md-4">
            <div class="card mb-4" data-category="drinks">
              <img src="https://via.placeholder.com/150" class="card-img-top" alt="Cold Drink">
              <div class="card-body">
                <h5 class="card-title">Cold Drink</h5>
                <p class="card-text">₹30</p>
                <button class="btn btn-primary add-to-cart" data-name="Cold Drink" data-price="30">Add to Cart</button>
              </div>
            </div>
          </div>

          <div class="col-md-4">
            <div class="card mb-4" data-category="burgers">
              <img src="https://via.placeholder.com/150" class="card-img-top" alt="Cheese Burger">
              <div class="card-body">
                <h5 class="card-title">Cheese Burger</h5>
                <p class="card-text">₹120</p>
                <button class="btn btn-primary add-to-cart" data-name="Cheese Burger" data-price="120">Add to Cart</button>
              </div>
            </div>
          </div>

          <div class="col-md-4">
            <div class="card mb-4" data-category="fries">
              <img src="https://via.placeholder.com/150" class="card-img-top" alt="Loaded Fries">
              <div class="card-body">
                <h5 class="card-title">Loaded Fries</h5>
                <p class="card-text">₹80</p>
                <button class="btn btn-primary add-to-cart" data-name="Loaded Fries" data-price="80">Add to Cart</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Cart Modal -->
  <div class="modal fade" id="cartModal" tabindex="-1" aria-labelledby="cartModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="cartModalLabel">Your Cart</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <ul id="cart-items" class="list-group">
            <!-- Cart items will be displayed here -->
          </ul>
          <div class="mt-3">
            <h5>Total: ₹<span id="modal-cart-total">0</span></h5>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-success" id="share-cart-button">Share Cart</button>
          <button type="button" class="btn btn-primary" id="checkout-button">Checkout</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    // Global variables
    let cart = [];
    let cartCount = 0;
    let cartTotal = 0;
    let isSharedCart = false;
    let sharedCartId = null;
    let cartOwnerUsername = null;
    let currentUsername = null;
    let socket = null;

    // Initialize socket connection
    function initializeSocket() {
      socket = io();
      
      socket.on('connect', () => {
        console.log('Connected to server');
      });

      // Listen for shared cart updates
      if (sharedCartId) {
        socket.on(`sharedCart-${sharedCartId}`, (data) => {
          handleSharedCartUpdate(data);
        });
      }
    }

    // Handle real-time shared cart updates
    function handleSharedCartUpdate(data) {
      switch (data.type) {
        case 'itemAdded':
          showNotification(`${data.item.addedBy} added ${data.item.name} to the cart`, 'success');
          if (data.item.addedBy !== currentUsername) {
            // Update cart display for other users
            cart.push(data.item);
            cartCount++;
            cartTotal = data.totalAmount;
            updateCartDisplay();
          }
          break;
        case 'cartCheckedOut':
          showNotification('Cart has been checked out successfully!', 'info');
          // Disable further actions
          disableCartActions();
          break;
      }
    }

    // Show notification
    function showNotification(message, type = 'info') {
      const notificationArea = document.getElementById('notification-area');
      const alertDiv = document.createElement('div');
      alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
      alertDiv.innerHTML = `
        ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      `;
      notificationArea.appendChild(alertDiv);
      
      // Auto remove after 5 seconds
      setTimeout(() => {
        if (alertDiv.parentNode) {
          alertDiv.parentNode.removeChild(alertDiv);
        }
      }, 5000);
    }

    // Disable cart actions after checkout
    function disableCartActions() {
      document.querySelectorAll('.add-to-cart').forEach(btn => {
        btn.disabled = true;
        btn.textContent = 'Cart Checked Out';
      });
      document.getElementById('checkout-button').disabled = true;
      document.getElementById('share-cart-button').disabled = true;
    }

    // Update cart display
    function updateCartDisplay() {
      document.getElementById('cart-count').innerText = cartCount;
      document.getElementById('cart-total').innerText = cartTotal;
      document.getElementById('modal-cart-total').innerText = cartTotal;
    }

    // Check if token is expired
    function isTokenExpired(token) {
      const jwt_decode = (token) => JSON.parse(atob(token.split('.')[1]));
      const decodedToken = jwt_decode(token);
      const currentTime = Date.now() / 1000;
      return decodedToken.exp < currentTime;
    }

    // Load shared cart data
    async function loadSharedCart(cartId) {
      try {
        const response = await fetch(`http://localhost:5000/auth/shared-cart/${cartId}`);
        const data = await response.json();
        
        if (data.success) {
          const sharedCart = data.cart;
          cart = sharedCart.items;
          cartCount = cart.length;
          cartTotal = sharedCart.totalAmount;
          cartOwnerUsername = sharedCart.ownerUsername;
          
          updateCartDisplay();
          showSharedCartBanner(sharedCart);
          
          // Hide share button for non-owners
          if (currentUsername !== cartOwnerUsername) {
            document.getElementById('share-cart-button').style.display = 'none';
            document.getElementById('checkout-button').classList.add('checkout-disabled');
            document.getElementById('checkout-button').title = 'Only cart owner can checkout';
          }
          
          return true;
        } else {
          showNotification(data.message, 'error');
          return false;
        }
      } catch (error) {
        console.error('Error loading shared cart:', error);
        showNotification('Error loading shared cart', 'error');
        return false;
      }
    }

    // Show shared cart banner
    function showSharedCartBanner(sharedCart) {
      const banner = document.getElementById('shared-cart-banner');
      const ownerBadge = document.getElementById('cart-owner-badge');
      const message = document.getElementById('shared-cart-message');
      const createdInfo = document.getElementById('cart-created-info');
      const copyLinkBtn = document.getElementById('copy-link-btn');
      
      ownerBadge.textContent = `Owner: ${sharedCart.ownerUsername}`;
      
      if (currentUsername === cartOwnerUsername) {
        message.textContent = 'This is your shared cart. You can add items and checkout.';
        copyLinkBtn.style.display = 'block';
      } else {
        message.textContent = 'You can add items to this shared cart. Only the owner can checkout.';
      }
      
      const createdDate = new Date(sharedCart.createdAt).toLocaleString();
      createdInfo.textContent = `Created: ${createdDate}`;
      
      banner.style.display = 'block';
    }

    // Copy cart link to clipboard
    function copyCartLink() {
      const shareUrl = `${window.location.origin}/menu.html?cartId=${sharedCartId}`;
      navigator.clipboard.writeText(shareUrl).then(() => {
        showNotification('Cart link copied to clipboard!', 'success');
      }).catch(err => {
        console.error('Error copying link:', err);
        showNotification('Error copying link', 'error');
      });
    }

    // Page initialization
    document.addEventListener("DOMContentLoaded", function () {
      console.log("Menu page loaded");
      
      // Get current user
      currentUsername = localStorage.getItem('username');
      
      // Get URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      sharedCartId = urlParams.get("cartId");
      
      // Initialize socket
      initializeSocket();
      
      if (sharedCartId) {
        isSharedCart = true;
        loadSharedCart(sharedCartId);
      }
      
      // Copy link button event
      document.getElementById('copy-link-btn').addEventListener('click', copyCartLink);
    });

    // Add to cart functionality
    document.querySelectorAll('.add-to-cart').forEach(button => {
      button.addEventListener('click', async function() {
        const itemName = this.dataset.name;
        const itemPrice = parseInt(this.dataset.price);
        const token = localStorage.getItem('token');

        if (!token || isTokenExpired(token)) {
          alert('Please login first');
          window.location.href = 'user_login_signup.html';
          return;
        }

        const item = { name: itemName, price: itemPrice };

        if (isSharedCart) {
          // Add to shared cart
          try {
            const response = await fetch('http://localhost:5000/auth/add-to-shared-cart', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
              },
              body: JSON.stringify({
                cartId: sharedCartId,
                item: item
              })
            });

            const data = await response.json();
            if (data.success) {
              cart.push({ ...item, addedBy: currentUsername });
              cartCount += 1;
              cartTotal = data.totalAmount;
              updateCartDisplay();
              showNotification(`${itemName} added to shared cart!`, 'success');
            } else {
              showNotification(data.message, 'error');
            }
          } catch (error) {
            console.error("Error adding to shared cart:", error);
            showNotification("Error adding item. Please try again.", 'error');
          }
        } else {
          // Add to local cart
          cart.push({ ...item, addedBy: currentUsername });
          cartCount += 1;
          cartTotal += itemPrice;
          updateCartDisplay();
          showNotification(`${itemName} added to cart!`, 'success');
        }
      });
    });

    // Show cart items in modal
    document.getElementById('cart-button').addEventListener('click', function() {
      const cartItemsList = document.getElementById('cart-items');
      cartItemsList.innerHTML = '';

      cart.forEach((item, index) => {
        const listItem = document.createElement('li');
        listItem.className = 'list-group-item d-flex justify-content-between align-items-center';
        
        const addedByText = item.addedBy ? `<div class="added-by-tag">Added by: ${item.addedBy}</div>` : '';
        
        listItem.innerHTML = `
          <div>
            ${item.name}
            ${addedByText}
          </div>
          <div>
            <span class="badge bg-primary rounded-pill">₹${item.price}</span>
            ${!isSharedCart ? `<button class="btn btn-danger btn-sm ms-2 remove-from-cart" data-index="${index}">Remove</button>` : ''}
          </div>
        `;
        cartItemsList.appendChild(listItem);
      });

      // Remove item from cart (only for local carts)
      if (!isSharedCart) {
        document.querySelectorAll('.remove-from-cart').forEach(button => {
          button.addEventListener('click', function() {
            const itemIndex = parseInt(this.dataset.index);
            const itemPrice = cart[itemIndex].price;

            cart.splice(itemIndex, 1);
            cartCount -= 1;
            cartTotal -= itemPrice;
            updateCartDisplay();
            
            // Refresh the modal cart
            document.getElementById('cart-button').click();
          });
        });
      }
    });

    // Share cart functionality
    document.getElementById('share-cart-button').addEventListener('click', async function() {
      if (cart.length === 0) {
        showNotification("Your cart is empty! Add items before sharing.", 'warning');
        return;
      }

      const token = localStorage.getItem('token');
      if (!token || isTokenExpired(token)) {
        alert('Please login first');
        return;
      }

      if (isSharedCart) {
        // Just copy the existing shared cart link
        copyCartLink();
        return;
      }

      try {
        const response = await fetch('http://localhost:5000/auth/create-shared-cart', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ items: cart })
        });

        const data = await response.json();
        if (data.success) {
          // Update URL and page state
          sharedCartId = data.cartId;
          isSharedCart = true;
          cartOwnerUsername = currentUsername;
          
          // Update URL without reload
          const newUrl = `${window.location.origin}/menu.html?cartId=${sharedCartId}`;
          window.history.pushState({}, '', newUrl);
          
          // Copy link to clipboard
          navigator.clipboard.writeText(data.shareUrl).then(() => {
            showNotification("Cart link copied to clipboard! Share it with your friends.", 'success');
          });
          
          // Show shared cart banner
          showSharedCartBanner({
            cartId: sharedCartId,
            ownerUsername: currentUsername,
            items: cart,
            totalAmount: cartTotal,
            createdAt: new Date()
          });
          
          // Listen for updates on this cart
          if (socket) {
            socket.on(`sharedCart-${sharedCartId}`, handleSharedCartUpdate);
          }
          
        } else {
          showNotification(data.message, 'error');
        }
      } catch (error) {
        console.error("Error creating shared cart:", error);
        showNotification("Error creating shared cart. Please try again.", 'error');
      }
    });

    // Checkout functionality
    document.getElementById('checkout-button').addEventListener('click', async function() {
      if (cart.length === 0) {
        showNotification("Your cart is empty!", 'warning');
        return;
      }

      const token = localStorage.getItem('token');
      if (!token || isTokenExpired(token)) {
        alert('Your session has expired. Please log in again.');
        return;
      }

      // Check if user can checkout
      if (isSharedCart && currentUsername !== cartOwnerUsername) {
        showNotification("Only the cart owner can checkout. You can only add items to this shared cart.", 'error');
        return;
      }

      try {
        let response;
        
        if (isSharedCart) {
          // Checkout shared cart
          response = await fetch('http://localhost:5000/auth/checkout-shared-cart', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`,
            },
            body: JSON.stringify({ cartId: sharedCartId }),
          });
        } else {
          // Checkout regular cart
          response = await fetch('http://localhost:5000/auth/place-order', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`,
            },
            body: JSON.stringify({
              cart: cart,
              total: cartTotal,
              username: currentUsername
            }),
          });
        }

        const data = await response.json();
        if (data.success) {
          showNotification("Order placed successfully!", 'success');
          
          // Clear cart
          cart = [];
          cartCount = 0;
          cartTotal = 0;
          updateCartDisplay();
          
          // Disable actions if shared cart
          if (isSharedCart) {
            disableCartActions();
          }
          
          // Close modal
          const modal = bootstrap.Modal.getInstance(document.getElementById('cartModal'));
          if (modal) modal.hide();
          
        } else {
          showNotification("Error placing order: " + data.message, 'error');
        }
      } catch (error) {
        console.error("Error:", error);
        showNotification("Failed to place order. Please try again.", 'error');
      }
    });

    // Category filtering
    document.querySelectorAll('.list-group-item-action').forEach(item => {
      item.addEventListener('click', function(e) {
        e.preventDefault();
        const category = this.dataset.category;
        
        // Remove active class from all items
        document.querySelectorAll('.list-group-item-action').forEach(i => i.classList.remove('active'));
        this.classList.add('active');
        
        // Filter menu items
        const menuItems = document.querySelectorAll('#menu-grid .card');
        menuItems.forEach(card => {
          if (category === 'all' || card.dataset.category === category) {
            card.parentElement.style.display = 'block';
          } else {
            card.parentElement.style.display = 'none';
          }
        });
      });
    });

    // Search functionality
    document.getElementById('search-bar').addEventListener('input', function() {
      const searchTerm = this.value.toLowerCase();
      const menuItems = document.querySelectorAll('#menu-grid .card');
      
      menuItems.forEach(card => {
        const itemName = card.querySelector('.card-title').textContent.toLowerCase();
        if (itemName.includes(searchTerm)) {
          card.parentElement.style.display = 'block';
        } else {
          card.parentElement.style.display = 'none';
        }
      });
    });

  </script>
</body>
</html>
